env:
  PROJECT_NAME: database

name: restart-production-database
on: [workflow_dispatch]
jobs:
  deploy:
    runs-on: [server]
    steps:
      - run: echo "HOME=$(pwd)" >> $GITHUB_ENV #fix https://github.com/actions/runner/issues/1864

      - name: Clean Workspace Folder
        run: |
          rm -rf ./* || true
          rm -rf ./.??* || true

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Stop old docker
        run: docker stop ${{ env.PROJECT_NAME }} || true

      - name: Remove old docker
        run: docker rm ${{ env.PROJECT_NAME }} || true

      - name: Start new docker
        run: docker run -itd --restart unless-stopped -e POSTGRES_USER=${{secrets.POSTGRES_USER}} -e POSTGRES_PASSWORD=${{secrets.POSTGRES_PASSWORD}} --network=ofh -p 127.0.0.1:5000:5432 -v /data:/var/lib/postgresql/data --name ${{ env.PROJECT_NAME }} postgres:17.2

      - name: Wait until database is online
        run: cat ${{ env.PROJECT_NAME }}/wait-for.sh | sh -s -- localhost:5432 -- echo "Database is up"
